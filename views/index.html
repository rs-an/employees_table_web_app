<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Справочник сотрудников</title>
    <link rel="stylesheet" href="/vendor/datatables.css">
    <link rel="stylesheet" href="/public/style/styles.css">
    <script defer src="/vendor/jquery.js"></script>
    <script defer src="/vendor/datatables.js"></script>
    <script defer src="/public/script/script.js"></script>
</head>
<body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l5-1L20 8a2.8 2.8 0 0 0-4-4L5 15l-1 5Z"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></symbol>
    </svg>
    <main class="workspace">
        <header class="page-heading">
            <h1 id="page-title">Справочник сотрудников</h1>
            <button class="button primary" id="addRow" disabled><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Добавить сотрудника</button>
        </header>
        <div id="connection" class="connection" data-state="connecting"><span id="status" role="status">Подключение…</span></div>
        <p id="message" class="message" role="alert" hidden></p>
        <section class="directory" aria-labelledby="page-title">
            <div class="toolbar">
                <label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Поиск сотрудников" aria-label="Поиск сотрудников"></label>
                <label class="department-filter"><span class="sr-only">Отдел</span><select id="department-filter"><option value="">Все отделы</option><option value="development">Разработка</option><option value="marketing">Маркетинг</option><option value="HR">HR</option></select></label>
            </div>
            <div class="table-scroll"><table id="example"><thead></thead><tbody></tbody></table></div>
            <div id="empty-state" class="empty-state" hidden><h2 id="empty-title">Сотрудников пока нет</h2><p id="empty-copy">Добавьте сотрудника, чтобы начать работу.</p><button class="button secondary" id="empty-action">Добавить сотрудника</button></div>
        </section>
    </main>
    <dialog id="editor" class="editor" aria-labelledby="editor-title">
        <form id="employee-form">
            <div class="editor-heading"><h2 id="editor-title">Новый сотрудник</h2><button type="button" class="icon-button" id="close-editor" aria-label="Закрыть карточку"><svg class="icon"><use href="#i-close"/></svg></button></div>
            <div class="editor-body">
                <fieldset><legend>Личные данные</legend><label>Фамилия<input name="surname" maxlength="32" autocomplete="off"></label><div class="form-grid"><label>Имя<input name="name" maxlength="32" autocomplete="off"></label><label>Отчество<input name="middle_name" maxlength="32" autocomplete="off"></label></div><label>Дата рождения<input name="birthday" type="text" maxlength="10" placeholder="ДД-ММ-ГГГГ" pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}" title="Введите дату в формате ДД-ММ-ГГГГ, например 25-12-1995"></label></fieldset>
                <fieldset><legend>Работа</legend><label>Отдел<select name="department"><option value="">Не выбран</option><option value="development">Разработка</option><option value="marketing">Маркетинг</option><option value="HR">HR</option></select></label><label>Должность<input name="position" maxlength="32"></label></fieldset>
                <fieldset><legend>Контакты</legend><label>Электронная почта<input name="email" type="email" maxlength="32"></label><label>Телефон<input name="tel" type="tel" maxlength="32"></label></fieldset>
                <p id="form-error" class="message" role="alert" hidden></p>
            </div>
            <div class="editor-footer"><button type="button" id="delete-employee" class="icon-button danger" aria-label="Удалить сотрудника" hidden><svg class="icon"><use href="#i-trash"/></svg></button><button type="button" id="cancel-editor" class="button secondary">Отмена</button><button type="submit" id="save-employee" class="button primary">Добавить</button></div>
        </form>
    </dialog>
    <dialog id="delete-dialog" class="confirm-dialog" aria-labelledby="delete-title"><h2 id="delete-title">Удалить сотрудника?</h2><p id="delete-description"></p><p class="muted">Карточка будет удалена из справочника. Это действие нельзя отменить.</p><div class="confirm-actions"><button class="button secondary" id="cancel-delete">Оставить</button><button class="button destructive" id="confirm-delete">Удалить</button></div></dialog>
    <div class="toast" id="toast" role="status" hidden><svg class="icon"><use href="#i-check"/></svg><span></span></div>
</body>
</html>
