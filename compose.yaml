services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-employeeDB}
      MYSQL_USER: ${DB_USER:-employees}
      MYSQL_PASSWORD: ${DB_PASSWORD:-employees_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - employees_data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT id FROM employees LIMIT 1"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  app:
    build: .
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-employeeDB}
      DB_USER: ${DB_USER:-employees}
      DB_PASSWORD: ${DB_PASSWORD:-employees_local}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  employees_data:
